name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push --tags
on:
  push:
    tags:
      - "v*"

# Needed so the auto-provided GITHUB_TOKEN (ephemeral, scoped to just this repo,
# expires when the job finishes) can create the release and attach files to it —
# no personal access token or manual credential setup required for this part.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Cross-compiles both RIDs from one Linux runner — no Windows/macOS runner
      # needed, same as building both locally from this machine.
      - name: Publish binaries
        run: ./publish.sh

      # Different archive format per platform, not just for convention: .zip is
      # what Windows users expect (native double-click support), but zip doesn't
      # reliably preserve the Unix executable bit — a browser download would leave
      # the Linux binary needing a manual `chmod +x`. tar.gz does round-trip that
      # bit correctly, which is the actual reason it's the Linux-side choice here.
      - name: Package release archives
        run: |
          version="${{ github.ref_name }}"
          tar -czf "GameArtMatch-${version}-linux-x64.tar.gz" -C publish/linux-x64 GameArtMatch
          (cd publish/win-x64 && zip -j "$GITHUB_WORKSPACE/GameArtMatch-${version}-win-x64.zip" GameArtMatch.exe)

      # Pulls just the section for this tag out of CHANGELOG.md (matched by
      # "## <tag>" heading) so the release body is the curated, user-facing
      # summary — not just a raw commit list. If a tag has no matching heading
      # (e.g. CHANGELOG.md wasn't updated before tagging), this produces an
      # empty file and the release falls back to auto-generated notes alone,
      # rather than failing the whole workflow.
      - name: Extract changelog section for this version
        run: |
          awk -v ver="${{ github.ref_name }}" '
            $0 ~ "^## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md

      - name: Create release and upload archives
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GameArtMatch-${{ github.ref_name }}-linux-x64.tar.gz
            GameArtMatch-${{ github.ref_name }}-win-x64.zip
          body_path: release_notes.md
          # GitHub's release API pre-pends `body`/`body_path` to the
          # auto-generated notes when both are given, rather than choosing one
          # or the other — so the curated summary stays on top, with the full
          # commit list still available below for anyone who wants it.
          generate_release_notes: true
